        <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
          <div class="section-title">Итоговый состав</div>
          <div id="ratio-summary"></div>
        </div>
      </div>
    </div>
  `;
}
function bindRatioCalc(){
  const KEY = 'ratioCalcState';
  let comps = [{name:'Гипс', ratio:2}, {name:'Вода', ratio:1}, {name:'Пигмент', ratio:0.05}];
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s) && s.length) comps = s; } catch(e){}
  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(comps)); }catch(e){} }
  function renderList(){
    const box = $('#ratio-list');
    box.innerHTML = comps.map((c,i)=>`
      <div class="ratio-row" data-idx="${i}">
        <input class="input" data-k="name" value="${esc(c.name)}" placeholder="Название">
        <input class="input" data-k="ratio" type="number" step="0.001" min="0" value="${c.ratio}" placeholder="Пропорция">
        <div class="ratio-out" data-out>0 г</div>
        <button class="icon-btn" data-del><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>`).join('');
    box.querySelectorAll('.ratio-row').forEach(row => {
      const i = +row.dataset.idx;
      row.querySelectorAll('[data-k]').forEach(inp => inp.oninput = ()=>{ const k = inp.dataset.k; comps[i][k] = k==='name' ? inp.value : num(inp.value); persist(); compute(); });
      row.querySelector('[data-del]').onclick = ()=>{ if (comps.length <= 1) return; comps.splice(i,1); persist(); renderList(); compute(); };
    });
  }
  function compute(){
    const totalMass = num($('#ratio-total').value);
    const sum = comps.reduce((s,c)=>s+num(c.ratio), 0) || 1;
    const rows = comps.map(c => ({ ...c, weight: (num(c.ratio)/sum) * totalMass }));
    $$('#ratio-list .ratio-row').forEach((row,i)=>{ const out = row.querySelector('[data-out]'); const w = rows[i].weight; out.textContent = w >= 1000 ? `${(w/1000).toFixed(2)} кг` : `${w.toFixed(1)} г`; });
    $('#ratio-summary').innerHTML = rows.map(r => `<div class="bd-row" style="color:var(--text-2)"><span>${esc(r.name || 'Без названия')} <span style="color:var(--text-3)">(${r.ratio})</span></span><span class="v" style="color:var(--text)">${r.weight.toFixed(1)} г</span></div>`).join('');
  }
  $('#ratio-total').addEventListener('input', compute);
  $('#ratio-add').onclick = ()=>{ comps.push({name:'', ratio:1}); persist(); renderList(); compute(); };
  renderList(); compute();
}

const CONV_CATS = {
  mass: { name:'Масса', units:{ 'миллиграмм':0.001, 'грамм':1, 'килограмм':1000, 'тонна':1e6, 'унция':28.3495, 'фунт':453.592 } },
  volume: { name:'Объём', units:{ 'миллилитр':1, 'литр':1000, 'куб. см':1, 'куб. метр':1e6, 'чайная ложка':5, 'столовая ложка':15, 'стакан (250 мл)':250 } },
  length: { name:'Длина', units:{ 'миллиметр':1, 'сантиметр':10, 'метр':1000, 'километр':1e6, 'дюйм':25.4 } },
};
function convertHtml(){
  return `
    <div class="calc-tool">
      <div class="card">
        <div class="card-header"><div><div class="card-title">Конвертер единиц</div><div class="card-desc">Масса, объём, длина</div></div></div>
        <div class="conv-cats" id="conv-cats">${Object.entries(CONV_CATS).map(([k,v]) => `<button class="btn btn-secondary btn-sm" data-cat="${k}">${v.name}</button>`).join('')}</div>
        <div class="conv-grid">
          <div class="field" style="margin-bottom:0"><label>Из</label><input class="input" type="number" step="any" id="conv-from-val" value="1"><select class="select" id="conv-from-unit" style="margin-top:8px"></select></div>
          <button class="conv-swap" id="conv-swap" title="Поменять"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m17 3-5 5 5 5M7 21l5-5-5-5M22 8H9M2 16h13"/></svg></button>
          <div class="field" style="margin-bottom:0"><label>В</label><input class="input" type="number" step="any" id="conv-to-val" value="1000"><select class="select" id="conv-to-unit" style="margin-top:8px"></select></div>
        </div>
        <div class="hint mt-2">${ICONS.info}<span>Пересчёт мгновенный.</span></div>
      </div>
    </div>
  `;
}
function bindConverter(){
  let cat = 'mass'; let lastEdited = 'from';
  function fillUnits(){
    const units = Object.keys(CONV_CATS[cat].units);
    const fromSel = $('#conv-from-unit'), toSel = $('#conv-to-unit');
    const kf = fromSel.value, kt = toSel.value;
    fromSel.innerHTML = units.map(u=>`<option>${u}</option>`).join('');
    toSel.innerHTML = units.map(u=>`<option>${u}</option>`).join('');
    fromSel.value = units.includes(kf) ? kf : units[0];
    toSel.value = units.includes(kt) ? kt : units[1] || units[0];
  }
  function compute(){
    const fromV = num($('#conv-from-val').value), toV = num($('#conv-to-val').value);
    const fromU = $('#conv-from-unit').value, toU = $('#conv-to-unit').value;
    const f = CONV_CATS[cat].units;
    if (lastEdited === 'from') $('#conv-to-val').value = Math.round(fromV * f[fromU] / f[toU] * 1e6) / 1e6;
    else $('#conv-from-val').value = Math.round(toV * f[toU] / f[fromU] * 1e6) / 1e6;
  }
  $$('#conv-cats button').forEach(b => b.onclick = ()=>{ cat = b.dataset.cat; $$('#conv-cats button').forEach(x => x.classList.remove('active')); b.classList.add('active'); fillUnits(); compute(); });
  $$('#conv-cats button')[0].classList.add('active');
  fillUnits(); compute();
  $('#conv-from-val').addEventListener('input', ()=>{ lastEdited='from'; compute(); });
  $('#conv-to-val').addEventListener('input', ()=>{ lastEdited='to'; compute(); });
  $('#conv-from-unit').addEventListener('change', compute);
  $('#conv-to-unit').addEventListener('change', compute);
  $('#conv-swap').onclick = ()=>{
    const fv = $('#conv-from-val').value, tv = $('#conv-to-val').value;
    const fu = $('#conv-from-unit').value, tu = $('#conv-to-unit').value;
    $('#conv-from-val').value = tv; $('#conv-to-val').value = fv;
    $('#conv-from-unit').value = tu; $('#conv-to-unit').value = fu;
    compute();
  };
}

function renderLibCats(){

  const total = cats.reduce((s,c)=>s+c.articles.length, 0);
  box.innerHTML = `

function renderLibArticles(){
  const box = $('#lib-articles'); if (!box) return;
  let articles = [];
  const cats = state.library.categories || [];
  if (state.libraryCategory === '__bookmarks__') cats.forEach(c => c.articles.forEach(a => { if (a.bookmarked) articles.push({ ...a, _cat: c.title }); }));
  else if (state.libraryCategory){ const c = cats.find(x => x.id === state.libraryCategory); if (c) articles = c.articles.map(a => ({ ...a, _cat: c.title })); }
  else cats.forEach(c => c.articles.forEach(a => articles.push({ ...a, _cat: c.title })));
  const q = (state.libraryQuery || '').trim().toLowerCase();
  if (q) articles = articles.filter(a => (a.title||'').toLowerCase().includes(q) || (a._cat||'').toLowerCase().includes(q) || (a.content||'').toLowerCase().includes(q) || (a.tags||[]).some(t => t.toLowerCase().includes(q)));
  if (!articles.length){ box.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><div class="empty-title">Ничего не найдено</div><div class="empty-sub">Измените запрос или категорию</div></div>`; return; }

async function renderTemplatesPage(){
  await loadTemplates();
  $('#topbar-actions').innerHTML = `
    <div style="position:relative;min-width:220px"><input class="input search-input" id="tpl-search" placeholder="Поиск шаблонов…" value="${esc(state.templateQuery)}"></div>
    <button class="btn btn-primary" id="new-template"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Новый</button>
  `;
  $('#new-template').onclick = ()=> templateDialog();
  $('#tpl-search').addEventListener('input', debounce(e => { state.templateQuery = e.target.value; renderTemplatesBody(); }, 200));

  const content = $('#content');
  content.innerHTML = `<div id="tpl-body"></div>`;
  renderTemplatesBody();
}
function renderTemplatesBody(){
  let list = state.templates.slice();
  if (state.templateQuery.trim()){ const q = state.templateQuery.toLowerCase(); list = list.filter(t => t.name.toLowerCase().includes(q) || (t.description||'').toLowerCase().includes(q)); }
  const body = $('#tpl-body');
  if (!list.length){
    body.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M3 9h18"/></svg><div class="empty-title">${state.templateQuery ? 'Ничего не найдено' : 'Ещё нет шаблонов'}</div><div class="empty-sub">${state.templateQuery ? 'Измените запрос' : 'Создайте типовые заготовки изделий'}</div></div>`;
    return;
  }
  const groups = {};
  list.forEach(t => { (groups[t.type] = groups[t.type]||[]).push(t); });
  body.innerHTML = Object.entries(groups).map(([type, items]) => `
    <div class="section-title">${{gypsum:'Гипс',resin:'Смола',fdm:'FDM',sla:'SLA'}[type] || type}</div>
    <div class="tiles">
      ${items.map(t => `
        <div class="tile" data-tid="${t.id}">
          <div class="tile-type">${esc(t.type.toUpperCase())}</div>
          <div class="tile-title">${esc(t.name)}</div>
          <div class="tile-desc">${esc(t.description||'Без описания')}</div>
          <div class="tile-foot">
            <span>Открыть →</span>
            <div style="display:flex;gap:4px">
              <button class="icon-btn" data-dup-t="${t.id}" title="Дублировать"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
              <button class="icon-btn" data-del-t="${t.id}" title="Удалить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
            </div>
          </div>
        </div>`).join('')}
    </div>
  `).join('');
  body.querySelectorAll('.tile').forEach(el => el.onclick = (e)=>{
    if (e.target.closest('[data-del-t]') || e.target.closest('[data-dup-t]')) return;
    const t = state.templates.find(x => x.id === +el.dataset.tid);
    if (!t) return;
    const type = (t.type==='fdm'||t.type==='sla') ? 'print3d' : t.type;
    state.activeForm = { ...defaultForm(type), ...JSON.parse(JSON.stringify(t.data)) };
    state.calcType = type;
    if (t.type==='fdm'||t.type==='sla') state.print3dSub = t.type;
    state.currentProjectId = null;
    markDirty();
    navigate('calc', { type });
  });
  body.querySelectorAll('[data-del-t]').forEach(el => el.onclick = async (e)=>{
    e.stopPropagation();
    if (!confirm('Удалить шаблон?')) return;
    await api.call('delete_template', +el.dataset.delT);
    toast('Удалён');
    renderTemplatesPage();
  });
  body.querySelectorAll('[data-dup-t]').forEach(el => el.onclick = async (e)=>{
    e.stopPropagation();
    const t = state.templates.find(x => x.id === +el.dataset.dupT);
    if (!t) return;
    await api.call('save_template', { name: t.name + ' (копия)', type: t.type, description: t.description, data: t.data });
    toast('Дубликат создан');
    renderTemplatesPage();
  });
}
function templateDialog(){
  openModal(`
    <div class="modal-head"><div class="card-title">Новый шаблон</div><button class="icon-btn" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body">
      <div class="field"><label>Название</label><input class="input" id="t-name" placeholder="Подсвечник классический"></div>
      <div class="field"><label>Тип</label><select class="select" id="t-type"><option value="gypsum">Гипс</option><option value="resin">Смола</option><option value="fdm">FDM</option><option value="sla">SLA</option></select></div>
      <div class="field"><label>Описание</label><textarea class="textarea" id="t-desc"></textarea></div>

    <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button><button class="btn btn-primary" id="t-save">Создать</button></div>
  `);

async function renderJournalPage(){
  await loadJournal();
  const entries = state.journal;
  const totalRevenue = entries.reduce((s,e)=>s+num(e.revenue), 0);
  const totalCost = entries.reduce((s,e)=>s+num(e.cost), 0);
  const totalProfit = totalRevenue - totalCost;
  const month = new Date().toISOString().slice(0,7);
  const monthRevenue = entries.filter(e => (e.created_at||'').startsWith(month)).reduce((s,e)=>s+num(e.revenue),0);

  $('#topbar-actions').innerHTML = `<button class="btn btn-primary" id="add-entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Добавить запись</button>`;
  $('#add-entry').onclick = addJournalDialog;

  const content = $('#content');
  content.innerHTML = `
    <div class="stats stagger">
      <div class="stat"><div class="stat-lbl">Записей</div><div class="stat-val" id="j-count">0</div><div class="stat-sub">всего изготовлено</div></div>
      <div class="stat"><div class="stat-lbl">Выручка</div><div class="stat-val" id="j-rev">0 <small>₽</small></div></div>
      <div class="stat"><div class="stat-lbl">Прибыль</div><div class="stat-val" id="j-profit" style="color:var(--success)">0 <small>₽</small></div></div>
      <div class="stat"><div class="stat-lbl">Этот месяц</div><div class="stat-val" id="j-month">0 <small>₽</small></div></div>
    </div>
    <div class="card">
      <div class="card-header"><div><div class="card-title">Журнал</div></div></div>
      ${entries.length ? `
        <table class="table">
          <thead><tr><th>Дата</th><th>Изделие</th><th>Тип</th><th style="text-align:right">Кол-во</th><th style="text-align:right">Себест.</th><th style="text-align:right">Продано</th><th style="text-align:right">Прибыль</th><th></th></tr></thead>
          <tbody>
            ${entries.map(e => {
              const profit = num(e.revenue) - num(e.cost);
              return `<tr><td class="tiny muted">${(e.created_at||'').slice(0,16).replace('T',' ')}</td><td><strong>${esc(e.project_name||'—')}</strong></td><td>${typeBadge(e.type||'')}</td><td style="text-align:right">${e.quantity}</td><td style="text-align:right">${fmt(e.cost)} ₽</td><td style="text-align:right">${fmt(e.revenue)} ₽</td><td style="text-align:right;font-weight:600;color:${profit>=0?'var(--success)':'var(--danger)'}">${fmt(profit)} ₽</td><td style="text-align:right"><button class="icon-btn" data-jdel="${e.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button></td></tr>`;
            }).join('')}
          </tbody>
        </table>
      ` : `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><div class="empty-title">Журнал пуст</div><div class="empty-sub">Добавляйте записи при продаже</div></div>`}
    </div>
  `;
  setTimeout(()=>{
    const c = $('#j-count'); if (c) countUp(c, entries.length);
    const r = $('#j-rev'); if (r) { const el=r; const t=Math.round(totalRevenue); const s=performance.now(); (function a(n){const p=Math.min((n-s)/600,1);el.innerHTML=Math.round(t*(1-Math.pow(1-p,3))).toLocaleString('ru-RU')+' <small>₽</small>';if(p<1)requestAnimationFrame(a);})(performance.now()); }
    const pr = $('#j-profit'); if (pr) { const el=pr; const t=Math.round(totalProfit); const s=performance.now(); (function a(n){const p=Math.min((n-s)/700,1);el.innerHTML=Math.round(t*(1-Math.pow(1-p,3))).toLocaleString('ru-RU')+' <small>₽</small>';if(p<1)requestAnimationFrame(a);})(performance.now()); }
    const m = $('#j-month'); if (m) { const el=m; const t=Math.round(monthRevenue); const s=performance.now(); (function a(n){const p=Math.min((n-s)/600,1);el.innerHTML=Math.round(t*(1-Math.pow(1-p,3))).toLocaleString('ru-RU')+' <small>₽</small>';if(p<1)requestAnimationFrame(a);})(performance.now()); }
  }, 100);
  content.querySelectorAll('[data-jdel]').forEach(b => b.onclick = async ()=>{
    if (!confirm('Удалить запись?')) return;
    await api.call('delete_journal', +b.dataset.jdel);
    renderJournalPage();
  });
}
function addJournalDialog(){

  openModal(`
    <div class="modal-head"><div class="card-title">Новая запись</div><button class="icon-btn" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>

      <div class="row row-2">
        <div class="field"><label>Тип</label><select class="select" id="j-type"><option value="gypsum">Гипс</option><option value="resin">Смола</option><option value="fdm">FDM</option><option value="sla">SLA</option></select></div>

        <div class="field"><label>Продано (за шт.)</label><div class="input-suffix"><input class="input" type="number" step="1" id="j-rev" value="0"><span class="suffix">₽</span></div></div>
      </div>
      <div class="field"><label>Заметка</label><input class="input" id="j-note"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button><button class="btn btn-primary" id="j-save">Сохранить</button></div>

    await api.call('add_journal', { project_id: $('#j-proj').value ? +$('#j-proj').value : null, project_name: name, type: $('#j-type').value, quantity: qty, cost: num($('#j-cost').value)*qty, revenue: num($('#j-rev').value)*qty, note: $('#j-note').value });
    closeModal(); toast('Запись добавлена'); renderJournalPage();
  };
}

async function renderStockPage(){
  await loadMaterials(); await loadLowStock();
  $('#topbar-actions').innerHTML = `<button class="btn btn-secondary" id="add-stock-mat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Новый материал</button>`;
  $('#add-stock-mat').onclick = ()=>matDialog();
  const items = state.materials;
  const content = $('#content');
  content.innerHTML = `
    ${state.lowStock.length ? `<div class="card" style="border-color:var(--warning);background:var(--warning-soft);margin-bottom:14px"><div class="card-title" style="color:var(--warning)">Требует пополнения (${state.lowStock.length})</div><div class="small muted" style="margin-top:6px">${state.lowStock.map(m=>esc(m.name)).join(', ')}</div></div>` : ''}
    <div class="card">
      <div class="card-header"><div><div class="card-title">Остатки материалов</div><div class="card-desc">Меняйте значения прямо в таблице</div></div></div>
      <table class="table">
        <thead><tr><th>Название</th><th>Категория</th><th>Ед.</th><th style="text-align:right">Остаток</th><th style="text-align:right">Мин.</th><th style="width:130px">Уровень</th></tr></thead>
        <tbody>
          ${items.map(m => {
            const ratio = m.stock_min > 0 ? m.stock / m.stock_min : 1;
            const cls = ratio <= 0.5 ? 'critical' : ratio <= 1 ? 'low' : '';
            const pct = m.stock_min > 0 ? Math.min(100, (m.stock / (m.stock_min * 2)) * 100) : 100;
            return `<tr>
              <td><strong>${esc(m.name)}</strong></td>
              <td class="small muted">${esc(m.category)}</td>
              <td>${esc(m.unit)}</td>
              <td style="text-align:right"><input class="input" type="number" step="0.01" value="${m.stock||0}" data-stock="${m.id}" style="width:100px;text-align:right;padding:5px 10px"></td>
              <td style="text-align:right"><input class="input" type="number" step="0.01" value="${m.stock_min||0}" data-stockmin="${m.id}" style="width:80px;text-align:right;padding:5px 10px"></td>
              <td><div class="stock-bar"><div class="stock-bar-fill ${cls}" style="width:${pct}%"></div></div></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
  content.querySelectorAll('[data-stock]').forEach(inp => inp.onchange = async ()=>{ await api.call('update_stock', +inp.dataset.stock, num(inp.value)); await loadMaterials(); await loadLowStock(); });
  content.querySelectorAll('[data-stockmin]').forEach(inp => inp.onchange = async ()=>{
    const m = state.materials.find(x => x.id === +inp.dataset.stockmin);
    if (!m) return;
    await api.call('save_material', { ...m, stock_min: num(inp.value) });
    await loadMaterials(); await loadLowStock();
  });
}

  content.querySelectorAll('[data-sdel]').forEach(b => b.onclick = async ()=>{ if (!confirm('Удалить?')) return; await api.call('delete_supplier', +b.dataset.sdel); toast('Удалено'); renderSuppliersPage(); });
}
function supplierDialog(s){
  const isNew = !s; s = s || { name:'', contact:'', phone:'', email:'', website:'', notes:'' };
  openModal(`
    <div class="modal-head"><div class="card-title">${isNew?'Новый поставщик':'Редактирование'}</div><button class="icon-btn" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body">
      <div class="field"><label>Название</label><input class="input" id="s-name" value="${esc(s.name)}"></div>
      <div class="row row-2"><div class="field"><label>Контакт</label><input class="input" id="s-contact" value="${esc(s.contact||'')}"></div><div class="field"><label>Телефон</label><input class="input" id="s-phone" value="${esc(s.phone||'')}"></div></div>
      <div class="row row-2"><div class="field"><label>Email</label><input class="input" id="s-email" value="${esc(s.email||'')}"></div><div class="field"><label>Сайт</label><input class="input" id="s-website" value="${esc(s.website||'')}"></div></div>
      <div class="field"><label>Заметки</label><textarea class="textarea" id="s-notes">${esc(s.notes||'')}</textarea></div>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button><button class="btn btn-primary" id="s-save">Сохранить</button></div>
  `);
  $('#s-save').onclick = async ()=>{
    const name = $('#s-name').value.trim();
    if (!name){ toast('Введите название','error'); return; }
    await api.call('save_supplier', { id: s.id || null, name, contact: $('#s-contact').value, phone: $('#s-phone').value, email: $('#s-email').value, website: $('#s-website').value, notes: $('#s-notes').value });
    closeModal(); toast('Сохранено'); renderSuppliersPage();
  };
}

/* ===================================================================
   СПРАВОЧНИК
=================================================================== */
const CATEGORIES = { gypsum:'Гипс', resin_a:'Смола A', resin_b:'Отвердитель B', fdm:'Филамент FDM', sla:'Фотополимер SLA', decor:'Декор', other:'Прочее' };
let catalogQuery = '';
let catalogFavOnly = false;

async function renderCatalogPage(){
  await loadMaterials();
  $('#topbar-actions').innerHTML = `
    <button class="btn btn-secondary" id="bulk-price"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Изменить цены</button>
    <button class="btn btn-secondary" id="csv-mat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>CSV</button>
    <button class="btn btn-primary" id="add-mat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Новый материал</button>
  `;
  $('#add-mat').onclick = ()=>matDialog();
  $('#csv-mat').onclick = exportMaterialsCSV;
  $('#bulk-price').onclick = bulkPriceDialog;

  const content = $('#content');
  content.innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <div style="flex:1;min-width:240px"><input class="input search-input" id="cat-search" placeholder="Поиск…" value="${esc(catalogQuery)}"></div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px 12px;background:var(--surface-3);border-radius:8px;border:1px solid var(--border)"><input type="checkbox" id="cat-fav" ${catalogFavOnly?'checked':''}>Только избранные</label>
      </div>
    </div>
    <div id="catalog-body"></div>
  `;
  $('#cat-search').addEventListener('input', debounce(e => { catalogQuery = e.target.value; renderCatalogBody(); }, 200));
  $('#cat-fav').addEventListener('change', e => { catalogFavOnly = e.target.checked; renderCatalogBody(); });
  renderCatalogBody();
}
function renderCatalogBody(){
  const q = catalogQuery.trim().toLowerCase();
  let list = state.materials.slice();
  if (q) list = list.filter(m => m.name.toLowerCase().includes(q) || (CATEGORIES[m.category]||'').toLowerCase().includes(q));
  if (catalogFavOnly) list = list.filter(m => m.favorite);
  const groups = {};
  list.forEach(m => { (groups[m.category] = groups[m.category]||[]).push(m); });
  const body = $('#catalog-body');
  if (!list.length){ body.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><div class="empty-title">Ничего не найдено</div></div>`; return; }
  body.innerHTML = Object.entries(groups).map(([cat, items]) => `
    <div class="card">
      <div class="card-header"><div><div class="card-title">${CATEGORIES[cat] || cat}</div><div class="card-desc">${items.length} ${plural(items.length, 'позиция','позиции','позиций')}</div></div></div>
      <table class="table">
        <thead><tr><th style="width:40px"></th><th>Название</th><th>Ед.</th><th style="text-align:right">Цена</th><th>Параметры</th><th></th></tr></thead>
        <tbody>${items.map(m => `
          <tr>
            <td><button class="icon-btn star ${m.favorite?'active':''}" data-fav="${m.id}"><svg viewBox="0 0 24 24" fill="${m.favorite?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></button></td>
            <td><strong>${esc(m.name)}</strong></td>
            <td>${esc(m.unit)}</td>
            <td style="text-align:right;font-variant-numeric:tabular-nums">${fmt(m.price)} ₽</td>
            <td style="color:var(--text-2);font-size:12.5px">${metaText(m)}</td>
            <td style="text-align:right;white-space:nowrap">
              <button class="icon-btn" data-dup-m="${m.id}" title="Дублировать"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
              <button class="btn btn-secondary btn-sm" data-edit="${m.id}" style="margin-left:4px">Изменить</button>
              <button class="icon-btn" data-del="${m.id}" style="display:inline-flex;vertical-align:middle;margin-left:4px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
            </td>
          </tr>`).join('')}</tbody>
      </table>
    </div>
  `).join('');
  body.querySelectorAll('[data-edit]').forEach(b => b.onclick = ()=>matDialog(+b.dataset.edit));
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = async ()=>{ if (!confirm('Удалить материал?')) return; await api.call('delete_material', +b.dataset.del); toast('Удалено'); await loadMaterials(); renderCatalogBody(); });
  body.querySelectorAll('[data-fav]').forEach(b => b.onclick = async ()=>{ await api.call('toggle_favorite', +b.dataset.fav); await loadMaterials(); renderCatalogBody(); });
  body.querySelectorAll('[data-dup-m]').forEach(b => b.onclick = async ()=>{
    const m = state.materials.find(x => x.id === +b.dataset.dupM);
    if (!m) return;
    await api.call('save_material', { ...m, id: null, name: m.name + ' (копия)' });
    toast('Дубликат создан'); await loadMaterials(); renderCatalogBody();
  });
}
function metaText(m){
  const parts = [];
  if (m.meta?.water_ratio != null) parts.push(`вода: ${m.meta.water_ratio} мл/г`);
  if (m.meta?.loss != null) parts.push(`потери: ${m.meta.loss}%`);
  return parts.join(' · ') || '—';
}
function exportMaterialsCSV(){
  const rows = [['ID','Название','Категория','Единица','Цена','Остаток','Мин. остаток','Вода мл/г','Потери %']];
  state.materials.forEach(m => rows.push([m.id, m.name, m.category, m.unit, m.price, m.stock||0, m.stock_min||0, m.meta?.water_ratio||'', m.meta?.loss||'']));
  const csv = '\uFEFF' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'materials.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('CSV сохранён');
}
function bulkPriceDialog(){
  openModal(`
    <div class="modal-head"><div class="card-title">Массовое изменение цен</div><button class="icon-btn" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body">
      <div class="field"><label>Категория</label><select class="select" id="bp-cat"><option value="__all__">Все категории</option>${Object.entries(CATEGORIES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
      <div class="field"><label>Изменить на % ${tip('Отрицательное число — снизить, положительное — повысить.')}</label><input class="input" type="number" step="1" id="bp-pct" value="10"></div>
      <div class="hint">${ICONS.warn}<span>Например, 10 = все цены вырастут на 10%. –5 = снизятся на 5%.</span></div>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button><button class="btn btn-primary" id="bp-apply">Применить</button></div>
  `);
  $('#bp-apply').onclick = async ()=>{
    const cat = $('#bp-cat').value;
    const pct = num($('#bp-pct').value);
    const targets = cat === '__all__' ? state.materials : state.materials.filter(m => m.category === cat);
    if (!targets.length){ toast('Нет материалов','error'); return; }
    if (!confirm(`Изменить цены у ${targets.length} материалов на ${pct}%?`)) return;
    for (const m of targets){
      const newPrice = Math.max(0, num(m.price) * (1 + pct/100));
      await api.call('save_material', { ...m, price: Math.round(newPrice * 100) / 100 });
    }
    closeModal(); toast('Цены обновлены'); await loadMaterials(); renderCatalogBody();
  };
}
function matDialog(id){
  const m = id ? state.materials.find(x=>x.id===id) : {name:'', category:'gypsum', unit:'kg', price:0, stock:0, stock_min:0, meta:{}, favorite:0};
  const isNew = !id;
  openModal(`
    <div class="modal-head"><div class="card-title">${isNew ? 'Новый материал' : 'Редактирование'}</div><button class="icon-btn" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body">
      <div class="field"><label>Название</label><input class="input" id="m-name" value="${esc(m.name)}" placeholder="Гипс скульптурный"></div>
      <div class="row row-2">
        <div class="field"><label>Категория</label><select class="select" id="m-cat">${Object.entries(CATEGORIES).map(([k,v])=>`<option value="${k}" ${k===m.category?'selected':''}>${v}</option>`).join('')}</select></div>
        <div class="field"><label>Единица</label><select class="select" id="m-unit">${['kg','g','ml','piece'].map(u=>`<option ${u===m.unit?'selected':''}>${u}</option>`).join('')}</select></div>
      </div>
      <div class="row row-3">
        <div class="field"><label>Цена за единицу</label><div class="input-suffix"><input class="input" type="number" step="0.01" min="0" id="m-price" value="${m.price}"><span class="suffix">₽</span></div></div>
        <div class="field"><label>Остаток</label><input class="input" type="number" step="0.01" min="0" id="m-stock" value="${m.stock||0}"></div>
        <div class="field"><label>Мин. остаток</label><input class="input" type="number" step="0.01" min="0" id="m-stockmin" value="${m.stock_min||0}"></div>
      </div>
      <div class="row row-2">
        <div class="field"><label>Пропорция воды ${tip('Для гипса: мл воды на 1 г.')}</label><input class="input" type="number" step="0.01" min="0" id="m-wr" value="${m.meta?.water_ratio ?? ''}" placeholder="0.7"></div>
        <div class="field"><label>Потери, %</label><input class="input" type="number" step="0.5" min="0" id="m-loss" value="${m.meta?.loss ?? ''}" placeholder="5"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button><button class="btn btn-primary" id="m-save">Сохранить</button></div>
  `);
  $('#m-save').onclick = async ()=>{
    const meta = {};
    if ($('#m-wr').value !== '') meta.water_ratio = num($('#m-wr').value);
    if ($('#m-loss').value !== '') meta.loss = num($('#m-loss').value);
    const data = { id: id || null, name: $('#m-name').value.trim(), category: $('#m-cat').value, unit: $('#m-unit').value, price: num($('#m-price').value), stock: num($('#m-stock').value), stock_min: num($('#m-stockmin').value), meta, favorite: m.favorite ? 1 : 0 };
    if (!data.name){ toast('Введите название','error'); return; }
    await api.call('save_material', data);
    closeModal(); toast('Сохранено'); await loadMaterials(); await loadLowStock(); renderCatalogBody();
  };
}

/* ===================================================================
   НАСТРОЙКИ
=================================================================== */
async function renderSettingsPage(){
  const s = state.settings;
  let backups = [];
  try { backups = await api.call('list_backups'); } catch(e){}
  $('#topbar-actions').innerHTML = '';
  const content = $('#content');
  content.innerHTML = `
    <div class="card" style="max-width:760px">
      <div class="card-header"><div><div class="card-title">Ставки и тарифы</div></div></div>
      <div class="row row-2">
        <div class="field"><label>Стоимость часа работы</label><div class="input-suffix"><input class="input" type="number" id="s-labor" value="${s.labor_rate}"><span class="suffix">₽/ч</span></div></div>
        <div class="field"><label>Тариф за электроэнергию</label><div class="input-suffix"><input class="input" type="number" step="0.1" id="s-el" value="${s.electricity_rate}"><span class="suffix">₽/кВт·ч</span></div></div>
        <div class="field"><label>Мощность принтера</label><div class="input-suffix"><input class="input" type="number" id="s-power" value="${s.printer_power}"><span class="suffix">Вт</span></div></div>
        <div class="field"><label>Амортизация</label><div class="input-suffix"><input class="input" type="number" id="s-amort" value="${s.amort_rate}"><span class="suffix">₽/ч</span></div></div>
        <div class="field"><label>Потери/брак</label><div class="input-suffix"><input class="input" type="number" step="0.5" id="s-waste" value="${s.default_waste}"><span class="suffix">%</span></div></div>
        <div class="field"><label>Наценка</label><div class="input-suffix"><input class="input" type="number" step="5" id="s-markup" value="${s.default_markup}"><span class="suffix">%</span></div></div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn btn-primary" id="s-save">Сохранить</button></div>
    </div>
    <div class="card" style="max-width:760px">
      <div class="card-header"><div><div class="card-title">Оформление</div><div class="card-desc">5 тем</div></div></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px">
        ${[['light','Светлая','#ffffff','#6366f1'],['dark','Тёмная','#171c27','#818cf8'],['sepia','Тёплая','#fbf7ef','#b45309'],['nord','Nord','#ffffff','#5e81ac'],['plum','Plum','#241a2e','#c084fc']].map(([id,label,bg,ac]) => `
          <button class="btn btn-secondary" data-theme-pick="${id}" style="flex-direction:column;gap:8px;padding:16px 12px;height:auto;${state.theme===id?'border-color:var(--accent);background:var(--accent-soft)':''}">
            <div style="width:100%;height:40px;border-radius:8px;background:${bg};border:1px solid var(--border);display:flex;align-items:flex-end;justify-content:flex-end;padding:4px"><div style="width:14px;height:14px;border-radius:4px;background:${ac}"></div></div>
            <span style="font-weight:600;font-size:12.5px">${label}</span>
          </button>`).join('')}
      </div>
    </div>
    <div class="card" style="max-width:760px">
      <div class="card-header"><div><div class="card-title">Данные и резервные копии</div></div></div>
      <button class="btn btn-primary" id="bkp-create"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Создать резервную копию</button>
      ${backups.length ? `<div style="margin-top:14px"><div class="section-title">Последние копии</div>${backups.slice(0, 8).map(b => `<div class="flex-between" style="padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--surface-2)"><div><div style="font-weight:600;font-size:13px">${esc(b.name)}</div><div class="tiny muted">${(b.date||'').slice(0,16).replace('T',' ')} · ${(b.size/1024).toFixed(1)} КБ</div></div><button class="btn btn-secondary btn-sm" data-restore="${esc(b.path)}">Восстановить</button></div>`).join('')}</div>` : ''}

    renderSettingsPage();
  });

    await api.call('save_settings', { labor_rate: $('#s-labor').value, electricity_rate: $('#s-el').value, printer_power: $('#s-power').value, amort_rate: $('#s-amort').value, default_waste: $('#s-waste').value, default_markup: $('#s-markup').value });

    try { await api.call('import_backup', b.dataset.restore); toast('Восстановлено'); await Promise.all([loadSettings(), loadMaterials(), loadProjects(), loadLibrary(), loadTemplates(), loadSuppliers(), loadJournal(), loadLowStock()]); renderSettingsPage(); } catch(e){ toast('Ошибка','error'); }
  });
}

/* ===================================================================
   ГОРЯЧИЕ КЛАВИШИ
=================================================================== */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.ctrlKey || e.metaKey){
    if (e.key === 'n'){ e.preventDefault(); navigate('calc', { type: 'gypsum' }); }
    else if (e.key === 's' && state.page === 'calc'){ e.preventDefault(); saveProject(); }
    else if (e.key === 'p' && state.page === 'calc'){ e.preventDefault(); exportPDF(); }
    else if (e.key === 'd' && state.page === 'calc'){ e.preventDefault(); state.currentProjectId = null; state.activeForm = null; renderCalcPage(state.calcType); toast('Начат новый расчёт'); }
    else if (e.key === 'k'){ e.preventDefault(); navigate('library'); }
  }
});

/* ===================================================================
   ИНИЦИАЛИЗАЦИЯ
=================================================================== */
async function init(){
  try { await loadSettings(); } catch(e){ console.error(e); }
  try { await Promise.all([loadMaterials(), loadProjects(), loadLibrary(), loadTemplates(), loadSuppliers(), loadJournal()]); } catch(e){}
  try { await loadLowStock(); } catch(e){}
  navigate('dashboard');
}
window.addEventListener('pywebviewready', init);
window.navigate = navigate;
</script>
</body>
